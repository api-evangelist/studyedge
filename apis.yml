description: StudyEdge (Study Edge) is an education technology company that operates
  an online learning platform for students, delivering video courses, tutoring, and
  scheduled study sessions through a consumer web experience. The site organizes learning
  by school and subject with a Courses & Schedule catalog, a Help Center, and paid
  membership access, and is hosted on the Thinkific course platform with OpenID Connect
  sign-in for end users. Surfaced as a 500 Global portfolio company and added to the
  API Evangelist network, StudyEdge is a consumer-facing product with no public developer
  API, SDK, or developer portal detected during enrichment.
